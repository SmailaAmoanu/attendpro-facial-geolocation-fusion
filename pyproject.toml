[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "attendpro-paper2"
version = "1.0.0"
description = "Reproducible facial-geolocation fusion simulation for AttendPro Paper II"
requires-python = ">=3.11,<3.14"
dependencies = [
    "numpy==2.3.5", "pandas==2.2.3", "scipy==1.17.0",
    "scikit-learn==1.8.0", "joblib==1.5.3", "matplotlib==3.10.8",
    "threadpoolctl==3.6.0",
]

[project.optional-dependencies]
notebooks = ["jupyterlab>=4,<5", "nbformat>=5.10,<6", "nbclient>=0.10,<1", "ipykernel>=6,<8"]

[tool.setuptools.packages.find]
where = ["src"]
